# Cloudflare Worker deployment contract for drksci/id.
# Replace REPLACE_WITH_* values before use; no account IDs or secrets belong here.

name = "id-worker"
main = "../src/runtime.js"
compatibility_date = "2024-09-23"
workers_dev = false
preview_urls = false

[observability]
enabled = true

[assets]
directory = "../public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/healthz", "/readyz", "/approve/*"]

[vars]
APP_ENV = "prod"
PUBLIC_ISSUER = "https://id.drksci.com"
DURABLE_REPOSITORY = "drksci/id-data"

[[d1_databases]]
binding = "DB"
database_name = "id-data-prod"
database_id = "REPLACE_WITH_PROD_D1_DATABASE_ID"

[env.prod]
name = "id-worker"
workers_dev = false
preview_urls = false

[env.prod.vars]
APP_ENV = "prod"
PUBLIC_ISSUER = "https://id.drksci.com"
DURABLE_REPOSITORY = "drksci/id-data"

[[env.prod.d1_databases]]
binding = "DB"
database_name = "id-data-prod"
database_id = "REPLACE_WITH_PROD_D1_DATABASE_ID"

[env.dev]
name = "id-worker-dev"
workers_dev = true
preview_urls = false

[env.dev.vars]
APP_ENV = "dev"
PUBLIC_ISSUER = "https://dev.id.drksci.com"
DURABLE_REPOSITORY = "drksci/id-data"

[[env.dev.d1_databases]]
binding = "DB"
database_name = "id-data-dev"
database_id = "REPLACE_WITH_DEV_D1_DATABASE_ID"

[env.test]
name = "id-worker-test"
workers_dev = true
preview_urls = false

[env.test.vars]
APP_ENV = "test"
PUBLIC_ISSUER = "https://test.id.drksci.com"
DURABLE_REPOSITORY = "drksci/id-data"

[[env.test.d1_databases]]
binding = "DB"
database_name = "id-data-test"
database_id = "REPLACE_WITH_TEST_D1_DATABASE_ID"

[env.preview]
name = "id-worker-preview"
workers_dev = true
preview_urls = true

[env.preview.vars]
APP_ENV = "preview"
PUBLIC_ISSUER = "https://id-preview.drksci.com"
DURABLE_REPOSITORY = "drksci/id-data"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "id-data-preview"
database_id = "REPLACE_WITH_PREVIEW_D1_DATABASE_ID"
