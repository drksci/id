# Cloudflare Worker deployment contract for drksci/id.
# D1 IDs are explicit ${D1_DATABASE_ID_*} references rendered by CI; no account IDs or secrets
# belong here.

name = "id-worker"
main = "../src/index.ts"
compatibility_date = "2024-09-23"
workers_dev = false
preview_urls = false

[observability]
enabled = true

[assets]
directory = "../public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/healthz", "/readyz", "/approve/*"]

[vars]
APP_ENV = "prod"
FEEDBACK_ENABLED = "true"
ASSISTANT_ENABLED = "true"
WORKSPACE = "workspace://drksci/id/prod"
RESOURCE = "github:drksci/id"
PUBLIC_ISSUER = "https://id.drksci.com"
WORKSPACE_CANONICAL_SUFFIX = "id.drksci.com"
WORKSPACE_ALIAS_SUFFIX = "drksci.com"
WORKSPACE_SLUG_PATTERN = "^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$"
WORKSPACE_RESERVED_LABELS = "api,console,docs,idea,dev,test,preview,www,mcp,oauth,status"

[[d1_databases]]
binding = "DB"
database_name = "id-data-prod"
database_id = "${D1_DATABASE_ID_PROD}"
migrations_dir = "../migrations"

[env.prod]
name = "id-worker"
workers_dev = false
preview_urls = false

