name: Deploy id-worker

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Worker environment to deploy
        required: true
        type: choice
        options:
          - dev
          - test
          - preview
          - prod
  push:
    branches:
      - main
    paths:
      - infra/wrangler.toml
      - infra/render-wrangler-config.py
      - src/**
      - migrations/**
      - package.json
      - package-lock.json
      - public/**

permissions:
  contents: read
  id-token: write

concurrency:
  group: id-worker-${{ github.event.inputs.environment || 'prod' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ github.event.inputs.environment || 'prod' }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment || 'prod' }}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      D1_DATABASE_ID_PROD: ${{ vars.D1_DATABASE_ID_PROD }}
      D1_DATABASE_ID_DEV: ${{ vars.D1_DATABASE_ID_DEV }}
      D1_DATABASE_ID_TEST: ${{ vars.D1_DATABASE_ID_TEST }}
      D1_DATABASE_ID_PREVIEW: ${{ vars.D1_DATABASE_ID_PREVIEW }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js for Wrangler
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate deployment inputs
        env:
          TARGET_ENVIRONMENT: ${{ github.event.inputs.environment || 'prod' }}
        run: |
          test -f src/runtime.js
          test -f src/index.ts
          test -d public
          test -f infra/wrangler.toml
          # Fail before running the suite if this environment's database id is not available, rather
          # than several steps later with a message about a different environment.
          python3 infra/render-wrangler-config.py --env "$TARGET_ENVIRONMENT" --check

      - name: Run runtime tests
        run: npm test

      - name: Render deployment config from environment variables
        id: render-config
        env:
          TARGET_ENVIRONMENT: ${{ github.event.inputs.environment || 'prod' }}
        run: |
          rendered_config="$(mktemp infra/wrangler.generated.XXXXXX.toml)"
          python3 infra/render-wrangler-config.py --env "$TARGET_ENVIRONMENT" --output "$rendered_config"
          echo "path=$rendered_config" >> "$GITHUB_OUTPUT"
          echo "environment=$TARGET_ENVIRONMENT" >> "$GITHUB_OUTPUT"

      - name: Apply D1 migrations
        env:
          DEPLOY_ENVIRONMENT: ${{ github.event.inputs.environment }}
        run: |
          target_environment="${DEPLOY_ENVIRONMENT:-prod}"
          case "$target_environment" in
            prod) database_name="id-data-prod" ;;
            dev) database_name="id-data-dev" ;;
            test) database_name="id-data-test" ;;
            preview) database_name="id-data-preview" ;;
            *) echo "unsupported deployment environment" >&2; exit 1 ;;
          esac
          npx --yes wrangler@4 d1 migrations apply "$database_name" \
            --config "${{ steps.render-config.outputs.path }}" \
            --env "$target_environment" --remote

      - name: Deploy selected environment
        env:
          DEPLOY_ENVIRONMENT: ${{ github.event.inputs.environment }}
        run: |
          if [ -n "$DEPLOY_ENVIRONMENT" ]; then
            npx --yes wrangler@4 deploy --config "${{ steps.render-config.outputs.path }}" --env "$DEPLOY_ENVIRONMENT"
          else
            npx --yes wrangler@4 deploy --config "${{ steps.render-config.outputs.path }}" --env prod
          fi

      - name: Remove rendered deployment config
        if: ${{ always() && steps.render-config.outputs.path != '' }}
        run: rm -f "${{ steps.render-config.outputs.path }}"

      - name: Check public readiness
        if: ${{ github.event.inputs.environment == 'prod' || github.event.inputs.environment == '' }}
        run: curl --fail --silent --show-error --retry 3 https://id.drksci.com/readyz
