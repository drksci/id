name: Deploy id-worker

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Worker environment to deploy
        required: true
        type: choice
        options:
          - dev
          - test
          - preview
          - prod
  # Deployment is keyed to a version tag, not to a push. A merge to main means "this is good", and
  # a tag means "this is a release" - collapsing the two is how a hotfix becomes indistinguishable
  # from an experiment, and how a rollback loses its target.
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write   # the release record is created here
  id-token: write

concurrency:
  group: id-worker-${{ github.event.inputs.environment || 'prod' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ github.event.inputs.environment || 'prod' }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment || 'prod' }}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      D1_DATABASE_ID_PROD: ${{ vars.D1_DATABASE_ID_PROD }}
      D1_DATABASE_ID_DEV: ${{ vars.D1_DATABASE_ID_DEV }}
      D1_DATABASE_ID_TEST: ${{ vars.D1_DATABASE_ID_TEST }}
      D1_DATABASE_ID_PREVIEW: ${{ vars.D1_DATABASE_ID_PREVIEW }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the tag has to be checked against main's history

      # A tag is a claim that this commit was reviewed. Verify the claim rather than trusting it,
      # so that tagging a feature branch cannot ship it.
      - name: Refuse a tag that is not on the default branch
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          git fetch --no-tags origin main
          if git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "$GITHUB_REF_NAME names a commit on main"
          else
            echo "::error::refusing to deploy $GITHUB_REF_NAME: the tagged commit is not on main"
            echo "A version tag must name a commit that was reviewed and merged."
            exit 1
          fi

      - name: Set up Node.js for Wrangler
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate deployment inputs
        env:
          TARGET_ENVIRONMENT: ${{ github.event.inputs.environment || 'prod' }}
        run: |
          test -f src/runtime.js
          test -f src/index.ts
          test -d public
          test -f infra/wrangler.toml
          # Fail before running the suite if this environment's database id is not available, rather
          # than several steps later with a message about a different environment.
          python3 infra/render-wrangler-config.py --env "$TARGET_ENVIRONMENT" --check

      - name: Run runtime tests
        run: npm test

      - name: Render deployment config from environment variables
        id: render-config
        env:
          TARGET_ENVIRONMENT: ${{ github.event.inputs.environment || 'prod' }}
        run: |
          rendered_config="$(mktemp infra/wrangler.generated.XXXXXX.toml)"
          python3 infra/render-wrangler-config.py --env "$TARGET_ENVIRONMENT" --output "$rendered_config"
          echo "path=$rendered_config" >> "$GITHUB_OUTPUT"
          echo "environment=$TARGET_ENVIRONMENT" >> "$GITHUB_OUTPUT"

      - name: Apply D1 migrations
        env:
          DEPLOY_ENVIRONMENT: ${{ github.event.inputs.environment }}
        run: |
          target_environment="${DEPLOY_ENVIRONMENT:-prod}"
          case "$target_environment" in
            prod) database_name="id-data-prod" ;;
            dev) database_name="id-data-dev" ;;
            test) database_name="id-data-test" ;;
            preview) database_name="id-data-preview" ;;
            *) echo "unsupported deployment environment" >&2; exit 1 ;;
          esac
          npx --yes wrangler@4 d1 migrations apply "$database_name" \
            --config "${{ steps.render-config.outputs.path }}" \
            --env "$target_environment" --remote

      - name: Deploy selected environment
        id: deploy
        env:
          DEPLOY_ENVIRONMENT: ${{ github.event.inputs.environment || 'prod' }}
        run: |
          set +e
          output="$(npx --yes wrangler@4 deploy --config "${{ steps.render-config.outputs.path }}" --env "$DEPLOY_ENVIRONMENT" 2>&1)"
          code=$?
          set -e
          printf '%s\n' "$output"
          [ "$code" -eq 0 ] || exit "$code"

          # The Worker version id is the only thing a rollback can target, so it is captured here
          # rather than reconstructed from a dashboard later.
          version_id="$(printf '%s' "$output" | grep -oE 'Worker Version ID:[[:space:]]*[0-9a-fA-F-]{36}' | head -1 | grep -oE '[0-9a-fA-F-]{36}' || true)"
          if [ -z "$version_id" ]; then
            echo "::warning::could not read the Worker Version ID from the deploy output; the release record will say so rather than leaving a blank"
            version_id="not-captured"
          fi
          echo "version_id=$version_id" >> "$GITHUB_OUTPUT"

          {
            echo "### Deployed \`$DEPLOY_ENVIRONMENT\`"
            echo ""
            echo "Worker Version ID: \`$version_id\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove rendered deployment config
        if: ${{ always() && steps.render-config.outputs.path != '' }}
        run: rm -f "${{ steps.render-config.outputs.path }}"

      # infra/README.md documents a rollback that redeploys "the pinned version ID from the release
      # record". Until this step existed, that record was never written.
      - name: Record the release
        if: ${{ startsWith(github.ref, 'refs/tags/v') && steps.deploy.outputs.version_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_ID: ${{ steps.deploy.outputs.version_id }}
        run: |
          tag="${GITHUB_REF_NAME}"
          notes="$(printf 'Deployed from tag \`%s\`.\n\n**Worker Version ID:** \`%s\`\n\nRoll back by redeploying that Worker version id. Do not roll back schema by deleting data.\n' "$tag" "$VERSION_ID")"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --notes "$notes"
            echo "updated the release record for $tag"
          else
            gh release create "$tag" --title "$tag" --notes "$notes"
            echo "created the release record for $tag"
          fi

      - name: Check public readiness
        if: ${{ github.event.inputs.environment == 'prod' || github.event.inputs.environment == '' }}
        run: curl --fail --silent --show-error --retry 3 https://id.drksci.com/readyz
